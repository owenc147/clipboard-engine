#26352d;font-weight:700}.profile b{display:block;color:#e0e7f0;font-size:12px}.profile small{font-size:10px}main{margin-left:218px;padding:29px 32px 24px;max-width:1600px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px}.kicker{font-size:10px;font-weight:650;letter-spacing:1.8px;color:var(--mint)}h1{font-size:29px;letter-spacing:-1px;margin:8px 0 0;font-weight:680}.top-actions{display:flex;gap:8px}.action{border:1px solid #343e4c;background:#1c2430;color:#cbd5e2;border-radius:8px;padding:10px 12px;font-size:12px;transition:background .18s}.action:hover{background:#2a3543}.primary{background:var(--mint);border-color:var(--mint);color:#123221;font-weight:700}.primary:hover{background:#d1ffe5}.toolbar{display:flex;align-items:center;gap:12px;border-top:1px solid #222b36;border-bottom:1px solid #222b36;padding:13px 0;flex-wrap:wrap}.field{display:flex;align-items:center;gap:9px;color:#7f8ea3;font-size:11px}.field input,.field select{background:#161d27;border:1px solid #2a3544;color:#d6deea;border-radius:7px;padding:8px 10px;width:120px;font-size:12px}.field select{width:128px}.toolbar .primary{margin-left:auto}#status{font-size:10px;color:#8291a6;margin:12px 0 28px;min-height:14px;line-height:1.5}.league-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 0 20px}.league-head h2{margin:0 0 10px;font-size:23px;font-weight:650;letter-spacing:-.6px}.pills{display:flex;gap:6px;flex-wrap:wrap}.pill{font-size:10px;color:#a2b0c2;padding:4px 7px;border:1px solid #303a48;border-radius:5px}.week-badge{text-align:right;color:#9babc0;font-size:11px}.week-badge b{display:block;color:#edf5ff;font-size:18px;margin-bottom:3px}.hero{position:relative;overflow:hidden;background:linear-gradient(115deg,#233e35,#192832 65%,#23243b);border:1px solid #3a534b;border-radius:16px;padding:22px 25px 18px;margin-bottom:20px}.hero:after{content:'';position:absolute;width:270px;height:270px;border:1px solid #a7d7be0d;border-radius:50%;right:-60px;top:-100px;pointer-events:none}.hero-label{color:#afc7bc;display:flex;justify-content:space-between;font-size:10px;letter-spacing:1.6px;font-weight:650}.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;padding:23px 0 17px}.team-label{color:#a8b9ba;font-size:10px;letter-spacing:1px;margin-bottom:8px}.team-name{font-size:13px;font-weight:600;line-height:1.4}.team.right{text-align:right}.scores{display:flex;align-items:center;gap:17px;font-size:43px;letter-spacing:-2px;font-weight:730;font-variant-numeric:tabular-nums}.scores .mine{color:#c5fadb}.scores .dash{font-size:18px;color:#778b8b;font-weight:400}.score-track{height:4px;display:flex;gap:4px}.score-track span{background:#b3f5d0;border-radius:5px}.score-track span+span{background:#9c90c9}.hero-footer{display:flex;justify-content:space-between;color:#9fb4b0;font-size:10px;margin-top:12px}.margin{color:#cdf7dd}.dashboard{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,1fr);gap:18px;align-items:start}.column{display:grid;gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden}.card-header{padding:18px 19px 15px;display:flex;justify-content:space-between;gap:8px;align-items:center}.card h3{font-size:14px;margin:0;font-weight:650;letter-spacing:-.2px}.small-label{font-size:10px;color:#8392a8}.card-body{padding:0 19px 19px}.health{display:flex;align-items:center;gap:7px;border-radius:7px;background:#20382b;color:#b3e8c5;padding:9px 11px;font-size:11px;line-height:1.5;margin-bottom:16px}.health.warn{background:#463624;color:#f4d098}.health-dot{width:6px;height:6px;background:currentColor;border-radius:50%;flex-shrink:0}.tabs{display:flex;gap:17px;border-bottom:1px solid var(--line);margin-bottom:3px}.tab{color:#8998ab;background:transparent;border:0;border-bottom:2px solid transparent;padding:0 0 10px;font-size:11px}.tab.active{color:var(--mint);border-bottom-color:var(--mint)}.player-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #252d39}.player-row:last-child{border-bottom:0;padding-bottom:1px}.slot{width:33px;flex-shrink:0;font-size:9px;font-weight:750;border-radius:4px;text-align:center;padding:5px 0;color:#b8a7f3;background:#332c49}.slot.RB{color:#9ce0cd;background:#213d39}.slot.WR{color:#a7c9fb;background:#26374d}.slot.TE{color:#f1c595;background:#423527}.slot.FLEX,.slot.SUPER_FLEX{font-size:8px;color:#bdb2ef;background:#332d46}.slot.DEF,.slot.K{color:#bbc5d5;background:#2e3543}.player-name{font-size:12px;font-weight:550;color:#dfe6ef;flex:1;line-height:1.45}.player-meta{font-size:10px;color:#8191a6;margin-left:4px}.flag{font-size:9px;color:#f1ca8d}.rank{color:#66768c;font-size:11px;width:14px;flex-shrink:0;font-variant-numeric:tabular-nums}.waiver{gap:8px}.adds{color:var(--mint);font-size:11px;font-variant-numeric:tabular-nums;text-align:right}.adds small{display:block;color:#718198;font-size:9px;margin-top:3px}.table{width:100%;border-collapse:collapse;font-size:11px}.table td{padding:10px 7px;border-top:1px solid #252e3b;line-height:1.4}.table tr.own{background:#26392f;color:#d5f6df}.table td:first-child{color:#7c8ca1;width:27px}.table td:last-child{color:#a2b3c6;text-align:right;white-space:nowrap}.depth{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:0 0 13px}.depth-item{background:#202936;border:1px solid #303b4a;border-radius:7px;text-align:center;padding:10px 3px}.depth-item small{display:block;font-size:9px;color:#9aaac0;margin-bottom:6px}.depth-item b{font-size:17px;color:#c4d4e8;font-variant-numeric:tabular-nums}.depth-item.positive b{color:var(--mint)}.depth-item.negative b{color:#e9bc8b}.trade-note{font-size:11px;color:#9bacc0;line-height:1.65}.trade-note p{margin:8px 0}.trade-note ul{padding-left:15px}.trade-note strong{color:#dae5f3}details{border-top:1px solid #2d453f;margin-top:15px;padding-top:12px;font-size:11px;color:#b8c9c7}summary{cursor:pointer;color:#bbd6c9}details p{line-height:1.8;color:#96b0ac}.footer{font-size:10px;color:#758398;line-height:1.7;margin:22px 0 0}.empty{padding:22px;color:#9baabd}.fade{animation:enter .2s ease-out}@keyframes enter{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(min-width:1400px){main{padding:34px 46px}.scoreboard{padding:28px 0}.scores{font-size:52px}}@media(max-width:1000px){aside{width:185px;padding:25px 12px}main{margin-left:185px;padding:25px 23px}.dashboard{grid-template-columns:minmax(0,1.15fr) minmax(230px,1fr)}.scores{font-size:34px;gap:10px}.scoreboard{gap:12px}.card-header{padding:16px 14px}.card-body{padding:0 14px 16px}.team-name{font-size:11px}.top-actions .action{padding:8px}.brand{font-size:16px}}@media(max-width:820px){.dashboard{grid-template-columns:1fr}.topbar{align-items:start}.top-actions{flex-direction:column}h1{font-size:25px}.scoreboard{grid-template-columns:1fr 1fr}.scores{grid-column:1/-1;grid-row:1;justify-content:center}.toolbar{gap:9px}.field{gap:6px}.field input{width:100px}.field select{width:110px}.toolbar .primary{margin-left:0}.week-badge{display:none}}

<aside><div class="brand"><div class="logo"><svg viewBox="0 0 40 40" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="13" y="1.5" width="14" height="5.5" rx="2.5" fill="currentColor" stroke="none"/><path d="M6.5 13l7 7m0-7l-7 7" stroke-width="3.6"/><circle cx="29" cy="30" r="5" stroke-width="3.4"/><path d="M17 14.5c7-2 15 1 16 8" stroke-width="3.2"/><path d="M29 20.5l4 3.5 3-4.3" stroke-width="3.2"/></svg></div>clipboard</div><div class="brand-caption">FANTASY SIDELINE</div><div class="nav-label">YOUR LEAGUES <span id="league-count"></span></div><nav id="nav" aria-label="Leagues"></nav><div class="sidebar-footer"><div class="profile"><div class="avatar" id="avatar">C</div><div><b id="profile-name">@coffero</b><small>Fantasy football</small></div></div>Never takes a snap.<br>Knows every call.</div></aside>
<main><header class="topbar"><div><div class="kicker" id="season">FANTASY FOOTBALL / 2026</div><h1>Know every call.</h1></div><div class="top-actions"><button class="action" onclick="toggleSidebar()" aria-label="Toggle league sidebar" title="Toggle sidebar (Control–Command–S)">◧</button><button class="action" onclick="send('copy')">Copy brief</button><button class="action" onclick="send('save')">Export ↗</button></div></header><div class="toolbar"><label class="field">Saved profiles <select id="saved-profiles" aria-label="Saved Sleeper profiles"></select></label><label class="field">Sleeper username <input id="user" value="coffero" aria-label="Sleeper username" spellcheck="false" placeholder="Enter a Sleeper username"></label><label class="field">Week <select id="week"><option value="">Current week</option></select></label><button id="refresh" class="action primary" onclick="send('refresh')">↻ Refresh</button></div><div id="status" role="status" aria-live="polite">Loading saved brief…</div><div id="freshness"></div><div class="view-switch" role="group" aria-label="Report view"><button id="overview-view" onclick="setView('overview')">Game plan <kbd>⌘1</kbd></button><button id="research-view" onclick="setView('research')">Scouting report <kbd>⌘2</kbd></button><button id="lineup-view" onclick="setView('lineup')">Lineup <kbd>⌘3</kbd></button><button id="radar-view" onclick="setView('radar')">League radar <kbd>⌘4</kbd></button><button id="moves-view" onclick="setView('moves')">Player moves <kbd>⌘6</kbd></button><button id="suggestions-view" onclick="setView('suggestions')">Suggestions <kbd>⌘5</kbd></button></div><div id="content"></div><footer class="footer">League data and trending adds: <a href="https://docs.sleeper.com/">Sleeper</a>. Scouting calls are dated analyst judgments, not automatic lineup changes.</footer></main>
<script src="research.js"></script><script>
let leagues=[],selected=0,rosterTab='Starters',reportWeek='1';const $=id=>document.getElementById(id);
for(let i=1;i<=18;i++){const o=document.createElement('option');o.value=i;o.textContent='Week '+i;$('week').append(o)}
function send(action){window.webkit.messageHandlers.app.postMessage({action,user:$('user').value,week:$('week').value})}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')}
function block(lines){let html='',list=false;for(const line of lines){if(line.startsWith('- ')){if(!list){html+='<ul>';list=true}html+='<li>'+inline(line.slice(2))+'</li>'}else{if(list){html+='</ul>';list=false}if(line.trim())html+='<p>'+inline(line)+'</p>'}}return html+(list?'</ul>':'')}
window.notice=data=>{$('status').textContent=data.status;if('busy'in data){$('refresh').disabled=data.busy;$('refresh').textContent=data.busy?'Refreshing…':'↻ Refresh'}};
window.receive=data=>{notice(data);const text=data.text,title=text.split('\n')[0];reportWeek=(title.match(/Week (\d+)/)||[])[1]||'—';const year=(title.match(/\b20\d\d\b/)||[])[0]||'';const user=(title.match(/\(@(.+)\)/)||[])[1]||$('user').value;$('season').textContent='FANTASY FOOTBALL / '+year;$('profile-name').textContent='@'+user;$('avatar').textContent=user.slice(0,1).toUpperCase();leagues=text.split(/^## /m).slice(1).map(chunk=>{const lines=chunk.split('\n');return {name:lines.shift(),lines:lines.join('\n').split('\n---')[0].split('\n')}});selected=Math.min(selected,Math.max(0,leagues.length-1));render()};
function players(text){return text.split(/,\s*(?![^()]*\))/).filter(s=>s&&s!=='—').map(raw=>{const slot=(raw.match(/^(QB|RB|WR|TE|FLEX|SUPER_FLEX|WRRB_FLEX|REC_FLEX|K|DEF) /)||[])[1];const s=slot?raw.slice(slot.length+1):raw;const meta=s.match(/\(([^)]+)\)/);const flag=s.match(/\[([^\]]+)\]/);return {slot:slot||(meta?meta[1].split(',')[0]:(s.includes('DST')?'DEF':'—')),name:s.replace(/\s*\([^)]+\)/,'').replace(/\s*\[[^\]]+\]/,'').trim(),meta:meta?meta[1]:'',flag:flag?flag[1]:''}})}
function playerRow(p){return '<div class="player-row"><span class="slot '+esc(p.slot)+'">'+esc(p.slot==='SUPER_FLEX'?'SFLX':p.slot)+'</span><span class="player-name">'+esc(p.name)+' <span class="player-meta">'+esc(p.meta.split(',')[1]||'')+'</span></span>'+(p.flag?'<span class="flag">'+esc(p.flag)+'</span>':'')+'</div>'}
function card(title,detail,body){return '<section class="card"><div class="card-header"><h3>'+title+'</h3><span class="small-label">'+detail+'</span></div><div class="card-body">'+body+'</div></section>'}
function render(){
$('nav').replaceChildren();$('league-count').textContent=' / '+leagues.length;leagues.forEach((l,i)=>{let b=document.createElement('button');b.className='nav'+(i===selected?' active':'');b.setAttribute('aria-current',i===selected?'page':'false');const initials=l.name.split(' ').map(s=>s[0]).slice(0,2).join('');b.innerHTML='<span class="league-icon">'+esc(initials)+'</span><span class="nav-name">'+esc(l.name)+'</span>';b.onclick=()=>{selected=i;rosterTab='Starters';render()};$('nav').append(b)});
if(!leagues.length){$('content').innerHTML='<div class="card empty">No leagues found for this account and season.</div>';return}
const l=leagues[selected],lines=l.lines;const find=prefix=>lines.find(s=>s.startsWith(prefix))||'';const format=(lines[0]||'').replace(/^_|_$/g,'');let sections={},active='intro';for(const line of lines){if(line.startsWith('### '))active=line.slice(4);else(sections[active]??=[]).push(line)}
const standings=find('**Standings:**').replace('**Standings:** ','').split(' · ').filter(Boolean).map(s=>({own:s.startsWith('**'),...(()=>{let m=s.replace(/\*\*/g,'').match(/^(\d+)\. (.+) \(([^)]+)\)$/);return m?{rank:m[1],name:m[2],record:m[3]}:{rank:'',name:s,record:''}})()}));const own=standings.find(s=>s.own);const matchup=find('**Week').match(/\*\*Week (\d+) opponent:\*\* (.+) — score so far ([\d.]+) to ([\d.]+)/);let hero='';if(matchup){let a=Number(matchup[3]),b=Number(matchup[4]),diff=a-b,share=a+b?100*a/(a+b):50;hero='<section class="hero"><div class="hero-label"><span>WEEK '+esc(matchup[1])+' MATCHUP</span><span>SCOREBOARD</span></div><div class="scoreboard"><div class="team"><div class="team-label">YOUR TEAM</div><div class="team-name">'+esc(own?.name||'Your team')+'</div></div><div class="scores"><span class="mine">'+a.toFixed(1)+'</span><span class="dash">:</span><span>'+b.toFixed(1)+'</span></div><div class="team right"><div class="team-label">OPPONENT</div><div class="team-name">'+esc(matchup[2])+'</div></div></div><div class="score-track" aria-hidden="true"><span style="width:'+share+'%"></span><span style="width:'+(100-share)+'%"></span></div><div class="hero-footer"><span class="margin">'+(a===0&&b===0?'No points recorded':diff===0?'Tied score':(diff>0?'Ahead by ':'Behind by ')+Math.abs(diff).toFixed(1)+' points')+'</span><span>As of last refresh</span></div><details><summary>Opponent lineup</summary><p>'+esc(find('Their starters:').replace('Their starters: ',''))+'</p></details></section>'}
const lineup=sections['Lineup check']||[],issues=lineup.filter(s=>s.startsWith('- ')),healthy=issues.some(s=>s.includes('No red flags')||s.includes('No flagged injuries'));const roster=players(find(rosterTab+':').replace(rosterTab+': ',''));const lineupBody='<div class="health '+(healthy?'':'warn')+'"><span class="health-dot"></span><span>'+issues.map(s=>inline(s.slice(2))).join('<br>')+'</span></div><div class="tabs" role="tablist" aria-label="Roster"><button class="tab '+(rosterTab==='Starters'?'active':'')+'" role="tab" aria-selected="'+(rosterTab==='Starters')+'" onclick="rosterTab=\'Starters\';render()">Starters</button><button class="tab '+(rosterTab==='Bench'?'active':'')+'" role="tab" aria-selected="'+(rosterTab==='Bench')+'" onclick="rosterTab=\'Bench\';render()">Bench</button></div>'+ (roster.map(playerRow).join('')||'<p class="trade-note">No players listed.</p>');
const waiverLines=Object.entries(sections).find(([k])=>k.startsWith('Waiver targets'))?.[1]||[];let waivers=waiverLines.filter(s=>s.startsWith('- ')).map((s,i)=>{const m=s.match(/^- (.+) — (?:added in )?([\d,]+) (?:leagues|adds) \(24h\)/);if(!m)return '<p class="trade-note">'+inline(s.slice(2))+'</p>';const p=players(m[1])[0],count=Number(m[2].replace(/,/g,'')),compact=count>=1e6?(count/1e6).toFixed(2)+'m':count>=1e3?Math.round(count/1e3)+'k':String(count);return '<div class="player-row waiver"><span class="rank">'+String(i+1).padStart(2,'0')+'</span><span class="player-name">'+esc(p.name)+'<br><span class="player-meta" style="margin-left:0">'+esc(p.meta||p.slot)+'</span></span><span class="adds" title="'+esc(m[2])+' adds">'+compact+'<small>24h adds</small></span></div>'}).join('');
const trades=sections['Trade angles']||[],depthLine=trades.find(s=>s.startsWith('Your depth'))||'';let depth=[...depthLine.matchAll(/(QB|RB|WR|TE) ([+-][\d.]+)/g)].map(m=>'<div class="depth-item '+(Number(m[2])>=.5?'positive':Number(m[2])<=-.5?'negative':'')+'"><small>'+m[1]+'</small><b>'+m[2]+'</b></div>').join('');const tradeBody='<div class="depth">'+depth+'</div><div class="trade-note">'+block(trades.filter(s=>!s.startsWith('Your depth')))+'</div><div class="small-label">Roster count vs. league average</div>';
const table='<table class="table" aria-label="League standings"><tbody>'+standings.map(s=>'<tr class="'+(s.own?'own':'')+'"><td>'+esc(s.rank)+'</td><td>'+esc(s.name)+'</td><td>'+esc(s.record)+'</td></tr>').join('')+'</tbody></table>';
$('content').innerHTML='<div class="fade"><div class="league-head"><div><h2>'+esc(l.name)+'</h2><div class="pills">'+format.split(', ').map(s=>'<span class="pill">'+esc(s)+'</span>').join('')+'</div></div><div class="week-badge"><b>'+(own?'#'+esc(own.rank):'Week '+esc(reportWeek))+'</b>'+(own?'League standing':'Weekly brief')+'</div></div>'+hero+'<div class="dashboard"><div class="column">'+card('Current roster',roster.length+' players',lineupBody)+card('Roster balance','COUNTS ONLY',tradeBody)+'</div><div class="column">'+card('Waiver watch','AVAILABLE IN YOUR LEAGUE',waivers)+card('Standings',standings.length+' teams · wins / points',table)+'</div></div></div>';
}
</script><script src="binocular.js"></script><script src="lineup.js"></script><script src="radar.js"></script><script src="suggestions.js"></script><script src="moves.js"></script><script src="profiles.js"></script><script src="desk.js"></script><script src="model-engine.js"></script><script src="model-view.js"></script><script src="scout.js"></script><script src="clipboard-shell.js"></script></body></html>
